version: '3.8'

services:
  api:
    build: .
    container_name: credit-delinquency-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model_v1.pkl
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  monitoring:
    build: .
    container_name: credit-delinquency-monitoring
    command: python -c "from src.monitoring import run_monitoring; run_monitoring()"
    environment:
      - MODEL_PATH=/app/models/model_v1.pkl
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
      - ./data:/app/data
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.5.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow
    volumes:
      - ./mlflow:/mlflow
    restart: unless-stopped

networks:
  default:
    name: credit-risk-network
